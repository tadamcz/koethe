  type: paper
  location: Math. Z. 32 (1930), pp. 161–186
  id: https://doi.org/10.1007/BF01194626
  relationship: background
  note: Origin of the conjecture.
- title: Logical connections between some open problems concerning nil rings
  authors:
  - Jan Krempa
  type: paper
  location: Fund. Math. 76 (1972), no. 2, pp. 121–130
  relationship: background
  note: Equivalence of Köthe's conjecture with the matrix form that is refuted here.
- title: Polynomial rings over nil rings need not be nil
  authors:
  - Agata Smoktunowicz
  type: paper
  location: J. Algebra 233 (2000), no. 2, pp. 427–436
  id: https://doi.org/10.1006/jabr.2000.8451
  relationship: background
  note: Counterexample to the related Amitsur conjecture, over countable fields; context for the construction here.
- title: A counterexample to Köthe's conjecture and a question of Rowen
  authors:
  - Tom Adamczewski
  - Bernhard Böhmler
  - René Marczinzik
  type: paper
  location: arXiv:2609.07996 [math.RA], 7 September 2026
  id: https://arxiv.org/abs/2609.07996
  relationship: other
  note: Human-written, independently checked version of the construction found here, generalised to an arbitrary
    countable field, refuting Köthe's conjecture as originally stated and answering a 1989 question of Rowen. The
    paper cites this repository as the source of the original construction and its formal proof.
