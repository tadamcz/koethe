version: v0.4
project:
  name: 'Köthe conjecture: disproof (Krempa''s matrix form)'
  description: 'Disproof of the Köthe conjecture in Krempa''s matrix form: there is a ring R with a nil two-sided
    ideal I such that the matrix ideal M_2(I) is not nil. Found autonomously by GPT-6 Astra in an Epoch AI evaluation
    run over the open problems of Formal Conjectures'' Wikipedia collection.'
  authors:
  - name: Tom Adamczewski
    github: tadamcz
    orcid: https://orcid.org/0000-0001-6772-1185
  license: Apache-2.0
  responsible_maintainers:
  - name: Tom Adamczewski
    github: tadamcz
    orcid: https://orcid.org/0000-0001-6772-1185
classification:
  arxiv:
  - math.RA
  msc2020:
  - 16N40
  - 16S50
sources:
- title: 'Köthe conjecture: disproof (Krempa''s matrix form)'
  type: original-proof
  relationship: other
  note: This formalization is the first presentation of the result. The Lean proof was found by a pre-release version
    of GPT-6 Astra working autonomously in Epoch AI's LeanOpenProblems harness; no human wrote or steered the proof.
    The proof has been machine-checked but not yet examined in depth by human experts; novelty of its ideas relative
    to the literature has not been established.
- title: Köthe conjecture (Wikipedia)
  type: web discussion
  id: https://en.wikipedia.org/wiki/K%C3%B6the_conjecture
  location: https://en.wikipedia.org/wiki/K%C3%B6the_conjecture
  relationship: background
  note: The problem page the Formal Conjectures statement cites.
- title: Die Struktur der Ringe, deren Restklassenring nach dem Radikal vollständig reduzibel ist
  authors:
